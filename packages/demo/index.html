<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU voxel-GI demos</title>
    <!-- GitHub Pages can't send COOP/COEP headers; this service worker injects them
         client-side so SharedArrayBuffer (the physics scene) works. No-op when the page
         is already crossOriginIsolated (vite dev/preview send the real headers). -->
    <script src="/coi-serviceworker.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d12;
        overflow: hidden;
        font-family: ui-monospace, monospace;
        color: #9aa4b2;
      }
      #c {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 12px;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
